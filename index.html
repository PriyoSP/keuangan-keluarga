<div class="card"><h2>Bagikan ke istri</h2><p class="m sm">Kirim link ini lewat WhatsApp, lalu kirim PIN di pesan terpisah.</p><button class="btn3" onclick="shareLink()">Salin link untuk istri</button><button class="btn3" onclick="resetId()">Ganti link data (Apps Script)</button></div><div class="card"><button class="btn3 danger" onclick="lock()">🔒 Kunci aplikasi di HP ini</button></div>`}
async function act(a,m){toast('Memproses…');const r=await call(a);if(!r.ok)return toast(r.error,'er');toast(m,'ok');if(r.url)sheet(`<h2>Selesai</h2><a class="btn" style="display:block;text-align:center;text-decoration:none" href="${esc(r.url)}" target="_blank">Buka di Google Drive</a>`)}
async function saveKey(){const r=await call('setKey',{key:$('#gk').value});if(!r.ok)return toast(r.error,'er');toast('Kunci disimpan','ok');refresh()}
</script>
<script>document.getElementById('v').textContent='b6 · blok 8/9';
/* ---- form transaksi (tambah/edit) ---- */
let F;
function openForm(id){const t=id&&S.tx.find(x=>x.id===id);F=t?{...t,jumlah:String(t.jumlah),edit:1}:{id:rid(),tanggal:today(),jenis:'keluar',jumlah:'',kategori:'',akun:S.acc[0]?.nama||'',akun_tujuan:'',catatan:'',toko:'',pencatat:LS.get('kk_who')||'Suami'};F.foto='';formUI()}
function readF(){['tanggal','catatan','akun','akun_tujuan','kategori','toko'].forEach(k=>{const e=$('#f_'+k);if(e)F[k]=e.value});const j=$('#f_jumlah');if(j)F.jumlah=j.value.replace(/\D/g,'')}
function setJ(j){readF();F.jenis=j;F.kategori='';formUI()}
function formUI(){const tr=F.jenis==='transfer',cs=S.cat.filter(c=>c.jenis===F.jenis),ao=(v)=>S.acc.map(a=>`<option ${a.nama===v?'selected':''}>${esc(a.nama)}</option>`).join('');
 sheet(`<div class="sp"><h2>${F.edit?'Ubah transaksi':'Tambah transaksi'}</h2><button class="chip" onclick="closeS()">✕</button></div>
<div class="seg" id="fj">${[['keluar','Pengeluaran'],['masuk','Pemasukan'],['transfer','Transfer']].map(j=>`<button class="${F.jenis===j[0]?'on':''}" onclick="setJ('${j[0]}')">${j[1]}</button>`).join('')}</div>
${!F.edit&&F.jenis==='keluar'?`<label class="btn2">📷 Foto struk (isi otomatis)<input type="file" accept="image/*" hidden onchange="scanF(this.files[0])"></label><div id="sc" class="sm m" style="margin:-4px 0 8px"></div>`:''}
<label>Nominal (Rp)</label><input id="f_jumlah" inputmode="numeric" placeholder="0" style="font-size:24px;font-weight:700" value="${fmt(F.jumlah)}" oninput="this.value=fmt(this.value)">
${tr?'':`<label>Kategori</label><select id="f_kategori"><option value="">Pilih kategori…</option>${cs.map(c=>`<option ${c.nama===F.kategori?'selected':''}>${esc(c.nama)}</option>`).join('')}</select>`}
<div class="row"><div><label>${tr?'Dari akun':'Akun'}</label><select id="f_akun">${ao(F.akun)}</select></div>${tr?`<div><label>Ke akun</label><select id="f_akun_tujuan"><option value="">Pilih…</option>${ao(F.akun_tujuan)}</select></div>`:''}</div>
<label>Tanggal</label><input id="f_tanggal" type="date" value="${esc(F.tanggal)}">
<label>Catatan (opsional)</label><input id="f_catatan" value="${esc(F.catatan)}" placeholder="mis. makan siang"><input id="f_toko" type="hidden" value="${esc(F.toko)}">
<label>Dicatat oleh</label><div class="seg">${['Suami','Istri'].map(w=>`<button class="${F.pencatat===w?'on':''}" onclick="setW('${w}')">${w}</button>`).join('')}</div>
<button class="btn" id="fs" onclick="saveF()">Simpan</button>${F.edit?`<button class="btn3 danger" style="margin-top:10px" onclick="confirmDel()">Hapus transaksi</button>`:''}${F.edit&&F.foto_url?`<a class="m sm" href="${esc(F.foto_url)}" target="_blank">Lihat foto struk</a>`:''}`);
 if(!F.edit&&!F.jumlah)setTimeout(()=>$('#f_jumlah')&&$('#f_jumlah').focus(),250)}
async function saveF(){readF();const v=+F.jumlah;let e='';
 if(!(v>0))e='Nominal wajib diisi dan harus lebih dari 0.';else if(F.jenis==='transfer'){if(!F.akun_tujuan||F.akun_tujuan===F.akun)e='Pilih akun tujuan yang berbeda.'}else if(!F.kategori)e='Pilih kategori.';
 if(!F.tanggal)e='Tanggal wajib diisi.';if(e)return toast(e,'er');
 const b=$('#fs');b.disabled=true;b.textContent='Menyimpan…';
 const r=await call(F.edit?'editTx':'addTx',{id:F.id,tanggal:F.tanggal,jenis:F.jenis,jumlah:v,kategori:F.jenis==='transfer'?'':F.kategori,akun:F.akun,akun_tujuan:F.jenis==='transfer'?F.akun_tujuan:'',catatan:F.catatan,pencatat:F.pencatat,toko:F.toko,foto:F.foto});
 if(!r.ok){b.disabled=false;b.textContent='Simpan';return toast('Gagal menyimpan: '+r.error+' Coba lagi, data tidak akan dobel.','er')}
 closeS();toast(r.dup?'Transaksi sudah tersimpan sebelumnya':'Tersimpan ✓','ok');refresh()}
function confirmDel(){sheet(`<h2>Hapus transaksi ini?</h2><p class="m">${esc(F.kategori||'Transfer')} · ${rp(+F.jumlah)}. Tindakan ini tidak bisa dibatalkan.</p><button class="btn" style="background:var(--out)" onclick="doDel()">Ya, hapus</button><button class="btn3" style="margin-top:10px" onclick="closeS()">Batal</button>`)}
async function doDel(){const r=await call('delTx',{id:F.id});if(!r.ok)return toast(r.error,'er');closeS();toast('Transaksi dihapus','ok');refresh()}
const shrink=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1400/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8).split(',')[1])};i.src=URL.createObjectURL(f)});
</script>
<script>
function setupId(){document.getElementById('app').innerHTML='<div class="card" style="margin-top:60px"><h2>💳 Sambungkan ke data keluarga</h2><p class="m sm">Tempel link aplikasi dari Apps Script (berakhiran /exec).</p><input id="sid" placeholder="https://script.google.com/macros/s/…/exec"><button class="btn" onclick="saveId()">Lanjut</button></div>'}
function saveId(){const m=(document.getElementById('sid').value||'').match(/\/macros\/s\/([\w-]+)/);if(!m)return toast('Link tidak valid. Pastikan berakhiran /exec','er');LS.set('kk_id',m[1]);boot()}
function shareLink(){navigator.clipboard.writeText(location.origin+location.pathname+'?id='+LS.get('kk_id')).then(()=>toast('Link disalin ✓','ok'),()=>toast('Gagal menyalin','er'))}
function resetId(){LS.set('kk_id','');LS.set('kk_pin','');location.reload()}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
<script>document.getElementById('v').textContent='b6 · blok 9/9';
async function scanF(f){if(!f)return;readF();const s=$('#sc');s.textContent='⏳ Membaca struk…';F.foto=await shrink(f);const r=await call('scan',{foto:F.foto});
 if(!r.ok){formUI();$('#sc').textContent='📎 Foto terlampir. '+r.error;return toast(r.error,'er')}
 const d=r.data,miss=[];if(d.total)F.jumlah=String(Math.round(d.total));else miss.push('total');
 if(d.tanggal&&/^\d{4}-\d{2}-\d{2}$/.test(d.tanggal))F.tanggal=d.tanggal;else miss.push('tanggal');
 if(d.toko){F.toko=d.toko;if(!F.catatan)F.catatan=d.toko}else miss.push('toko');
 const k=S.cat.find(c=>c.jenis==='keluar'&&c.nama===d.kategori);if(k)F.kategori=k.nama;
 formUI();$('#sc').textContent=miss.length?'⚠️ Tidak terbaca jelas: '+miss.join(', ')+'. Mohon isi manual.':'✅ Periksa hasil bacaan, koreksi bila perlu, lalu Simpan.'}
function accForm(id){const a=S.acc.find(x=>x.id===id)||{nama:'',tipe:'bank',saldo_awal:0};sheet(`<h2>${id?'Ubah akun':'Tambah akun'}</h2><label>Nama akun</label><input id="an" value="${esc(a.nama)}" placeholder="mis. BCA"><label>Jenis</label><select id="at">${[['tunai','Tunai'],['bank','Rekening bank'],['ewallet','E-wallet']].map(t=>`<option value="${t[0]}" ${a.tipe===t[0]?'selected':''}>${t[1]}</option>`).join('')}</select><label>Saldo awal (Rp)</label><input id="as" inputmode="numeric" value="${fmt(a.saldo_awal)}" oninput="this.value=fmt(this.value)"><button class="btn" onclick="saveAcc('${id||''}')">Simpan</button>`)}
async function saveAcc(id){const r=await call('saveAcc',{id,nama:$('#an').value,tipe:$('#at').value,saldo_awal:+$('#as').value.replace(/\D/g,'')});if(!r.ok)return toast(r.error,'er');closeS();toast('Akun tersimpan','ok');refresh()}
function catForm(id){const c=S.cat.find(x=>x.id===id)||{nama:'',jenis:'keluar'};sheet(`<h2>${id?'Ubah kategori':'Tambah kategori'}</h2><label>Nama</label><input id="cn" value="${esc(c.nama)}"><label>Jenis</label><select id="cj"><option value="keluar" ${c.jenis==='keluar'?'selected':''}>Pengeluaran</option><option value="masuk" ${c.jenis==='masuk'?'selected':''}>Pemasukan</option></select><button class="btn" onclick="saveCat('${id||''}')">Simpan</button>`)}
async function saveCat(id){const r=await call('saveCat',{id,nama:$('#cn').value,jenis:$('#cj').value});if(!r.ok)return toast(r.error,'er');closeS();toast('Kategori tersimpan','ok');refresh()}
function setW(w){readF();F.pencatat=w;LS.set('kk_who',w);formUI()}
function srch(v){S.q=v;clearTimeout(window.ht);window.ht=setTimeout(()=>{render();const i=$('input');i.focus();i.setSelectionRange(99,99)},350)}
document.getElementById('v').textContent='b6 · semua blok OK, memanggil boot';boot();
</script>
</html>
